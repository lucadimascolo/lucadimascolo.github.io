<style>
  :root{
    --bg: #1b1b1f;
    --panel: #232329;
    --ink: #f2f0e9;
    --muted: #8a8a93;
    --line: #34343c;
    --correct: #5a8f5a;
    --present: #c9a24b;
    --absent: #3c3c44;
    --accent: #d9764a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 20% -10%, rgba(217,118,74,0.12), transparent 45%),
      var(--bg);
    color:var(--ink);
    font-family: 'Courier New', monospace;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:32px 16px 60px;
  }
  /* ---------- GAME SCREEN ---------- */
  #game{display:flex; flex-direction:column; align-items:center; width:100%;}
  #placeholderRow{
    margin-bottom:14px;
  }
  #board{
    display:flex;
    flex-direction:column;
    gap:6px;
    margin-bottom:22px;
  }
  .row{display:flex; gap:6px;}
  .tile.empty{
    background:transparent;
    border-color:var(--line);
  }
  .tile{
    width:52px;
    height:52px;
    border:2px solid var(--line);
    border-radius:6px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:1.6rem;
    font-weight:700;
    text-transform:uppercase;
    background:var(--panel);
    transition: transform 0.15s ease;
  }
  .tile.pop{transform:scale(1.08);}
  .tile.correct{background:var(--correct); border-color:var(--correct); color:#fff;}
  .tile.present{background:var(--present); border-color:var(--present); color:#1b1b1f;}
  .tile.absent{background:var(--absent); border-color:var(--absent); color:#a9a9b0;}

  #guessRow{
    display:flex;
    gap:10px;
    margin-bottom:14px;
  }
  #guessInput{
    padding:12px 16px;
    font-size:1.2rem;
    letter-spacing:4px;
    text-transform:uppercase;
    background:var(--panel);
    border:2px solid var(--line);
    border-radius:8px;
    color:var(--ink);
    font-family:'Courier New', monospace;
    outline:none;
    width:200px;
  }
  #guessInput:focus{border-color:var(--accent);}
  #guessBtn{
    padding:12px 20px;
    background:var(--accent);
    color:#1b1b1f;
    border:none;
    border-radius:8px;
    font-weight:700;
    cursor:pointer;
    font-family:'Courier New', monospace;
  }
  #guessBtn:hover{filter:brightness(1.08);}

  #status{
    min-height:24px;
    font-size:0.95rem;
    color:var(--muted);
    margin-bottom:6px;
  }
  #status.win{color:var(--correct); font-weight:700;}

  #keyboard{
    display:flex;
    flex-direction:column;
    gap:6px;
    margin-top:18px;
  }
  .krow{display:flex; gap:5px; justify-content:center;}
  .key{
    min-width:30px;
    height:38px;
    padding:0 6px;
    border-radius:5px;
    background:var(--absent);
    border:none;
    color:var(--ink);
    font-family:'Courier New', monospace;
    font-weight:700;
    font-size:0.8rem;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .key.correct{background:var(--correct); color:#fff;}
  .key.present{background:var(--present); color:#1b1b1f;}
  .key.unused{background:#2a2a30; color:#6d6d75;}

  #newGameBtn{
    margin-top:24px;
    background:none;
    border:1px solid var(--line);
    color:var(--muted);
    padding:8px 16px;
    border-radius:8px;
    cursor:pointer;
    font-family:'Courier New', monospace;
    font-size:0.8rem;
  }
  #newGameBtn:hover{border-color:var(--accent); color:var(--accent);}

  .hidden{display:none !important;}
</style>
</head>
<body>

  <div id="game">
    <div id="status"></div>
    <div id="placeholderRow" class="row"></div>
    <div id="board"></div>

    <div id="guessRow">
      <input type="text" id="guessInput" autocomplete="off" spellcheck="false" placeholder="guess">
      <button id="guessBtn">Guess</button>
    </div>

    <div id="keyboard"></div>

    <button id="newGameBtn">Start over</button>
  </div>

<script>
(function(){
  const SECRET_WORD = 'SHAKIRA';

  const gameScreen = document.getElementById('game');
  const board = document.getElementById('board');
  const guessInput = document.getElementById('guessInput');
  const guessBtn = document.getElementById('guessBtn');
  const status = document.getElementById('status');
  const placeholderRow = document.getElementById('placeholderRow');
  const keyboardEl = document.getElementById('keyboard');
  const newGameBtn = document.getElementById('newGameBtn');

  let secretWord = '';
  let wordLength = 0;
  let won = false;
  const keyState = {}; // letter -> 'correct' | 'present' | 'absent'

  const KB_ROWS = [
    ['Q','W','E','R','T','Y','U','I','O','P'],
    ['A','S','D','F','G','H','J','K','L'],
    ['Z','X','C','V','B','N','M']
  ];

  function buildKeyboard(){
    keyboardEl.innerHTML = '';
    KB_ROWS.forEach(row => {
      const krow = document.createElement('div');
      krow.className = 'krow';
      row.forEach(letter => {
        const key = document.createElement('div');
        key.className = 'key';
        key.textContent = letter;
        key.id = 'key-' + letter;
        krow.appendChild(key);
      });
      keyboardEl.appendChild(krow);
    });
  }

  function updateKeyboard(){
    Object.keys(keyState).forEach(letter => {
      const el = document.getElementById('key-' + letter);
      if(!el) return;
      el.classList.remove('correct','present','unused');
      const s = keyState[letter];
      if(s === 'correct') el.classList.add('correct');
      else if(s === 'present') el.classList.add('present');
      else el.classList.add('unused');
    });
  }

  function startGame(){
    secretWord = SECRET_WORD;
    wordLength = secretWord.length;
    won = false;
    Object.keys(keyState).forEach(k => delete keyState[k]);

    board.innerHTML = '';
    status.textContent = '';
    status.classList.remove('win');
    guessInput.value = '';
    guessInput.setAttribute('maxlength', wordLength);
    guessInput.disabled = false;
    guessBtn.disabled = false;

    buildKeyboard();
    updateKeyboard();
    renderPlaceholderRow();

    guessInput.focus();
  }

  function renderPlaceholderRow(){
    placeholderRow.innerHTML = '';
    for(let i=0;i<wordLength;i++){
      const tile = document.createElement('div');
      tile.className = 'tile empty';
      placeholderRow.appendChild(tile);
    }
  }

  function evaluateGuess(guess){
    const result = new Array(wordLength).fill('absent');
    const secretArr = secretWord.split('');
    const guessArr = guess.split('');
    const used = new Array(wordLength).fill(false);

    // pass 1: correct
    for(let i=0;i<wordLength;i++){
      if(guessArr[i] === secretArr[i]){
        result[i] = 'correct';
        used[i] = true;
      }
    }
    // pass 2: present
    for(let i=0;i<wordLength;i++){
      if(result[i] === 'correct') continue;
      const idx = secretArr.findIndex((ch, j) => ch === guessArr[i] && !used[j]);
      if(idx !== -1){
        result[i] = 'present';
        used[idx] = true;
      }
    }
    return result;
  }

  function submitGuess(){
    if(won) return;
    const guess = guessInput.value.trim().toUpperCase();
    if(guess.length !== wordLength || !/^[A-Z]+$/.test(guess)){
      status.textContent = `Enter a ${wordLength}-letter word.`;
      status.classList.remove('win');
      return;
    }

    const result = evaluateGuess(guess);

    const row = document.createElement('div');
    row.className = 'row';
    guess.split('').forEach((letter, i) => {
      const tile = document.createElement('div');
      tile.className = 'tile';
      tile.textContent = letter;
      row.appendChild(tile);

      // update key state priority: correct > present > absent
      const current = keyState[letter];
      const next = result[i];
      if(current !== 'correct'){
        if(next === 'correct') keyState[letter] = 'correct';
        else if(next === 'present' && current !== 'present') keyState[letter] = 'present';
        else if(!current) keyState[letter] = 'absent';
      }
    });
    board.appendChild(row);

    // animate reveal
    const tiles = row.querySelectorAll('.tile');
    tiles.forEach((tile, i) => {
      setTimeout(() => {
        tile.classList.add(result[i]);
        tile.classList.add('pop');
        setTimeout(() => tile.classList.remove('pop'), 150);
      }, i * 120);
    });

    updateKeyboard();

    if(guess === secretWord){
      won = true;
      setTimeout(() => {
        status.textContent = `Solved it in ${board.children.length} ${board.children.length === 1 ? 'guess' : 'guesses'}! 🎉`;
        status.classList.add('win');
      }, tiles.length * 120 + 100);
      guessInput.disabled = true;
      guessBtn.disabled = true;
    } else {
      status.textContent = '';
      status.classList.remove('win');
    }

    guessInput.value = '';
    guessInput.focus();
  }

  guessBtn.addEventListener('click', submitGuess);
  guessInput.addEventListener('keydown', e => { if(e.key === 'Enter') submitGuess(); });
  newGameBtn.addEventListener('click', startGame);

  startGame();
})();
</script>
